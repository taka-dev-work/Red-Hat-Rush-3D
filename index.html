<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Red Hat Rush 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Outfit', sans-serif;
        overflow: hidden;
        background-color: #111; /* Darker background */
        touch-action: none;
      }
      /* 3D Scene Setup */
      .scene-container {
        perspective: 1000px; 
        overflow: hidden;
      }
      .world-plane {
        transform-style: preserve-3d;
        transform: rotateX(60deg) rotateZ(0deg);
      }
      /* Fix for nested 3D elements */
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .billboard {
        transform-style: preserve-3d;
        transform: rotateX(-60deg); 
      }
      /* Custom Utilities */
      .text-shadow-sm {
        text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
      }
      .text-shadow-lg {
        text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
      }
    </style>
